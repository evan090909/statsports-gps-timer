  <script>

const xml=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));

function matchWorkbook(record) {

  const sheet = '<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<cols><col min="1" max="1" width="18" customWidth="1"/><col min="2" max="2" width="30" customWidth="1"/>'
    +'<col min="3" max="7" width="24" customWidth="1"/><col min="8" max="10" width="18" customWidth="1"/></cols>'

['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="경기 기록" sheetId="1" r:id="rId1"/></sheets></workbook>'],

const KEY = 'statsports-match-timer-pc-v1';
const DEFAULT_NAME = '';
const DEFAULT_MATCH = '연습경기';
const TITLE = 'STATSports GPS 경기 시간 기록기';
const LABELS = {firstStart:'전반전 시작', firstEnd:'전반전 종료', secondStart:'후반전 시작', secondEnd:'후반전 종료', finish:'경기 종료'};
const app = document.querySelector('#app');
const dialog = document.querySelector('#confirmation');
let state = {name:DEFAULT_NAME, match:DEFAULT_MATCH, active:null, records:[]};
let view = 'home';
let selected = null;
let homeEditing = null;
let confirmAction;
let storageError = false;

try {
  const saved = localStorage.getItem(KEY);
  if (saved) state = JSON.parse(saved);
} catch {
  storageError = true;
}

function save(next) {
  try {
    if (storageError) throw new Error();
    localStorage.setItem(KEY, JSON.stringify(next));
    state = next;
    return true;
  } catch {
    alert('기록을 저장하지 못했습니다. 브라우저의 로컬 저장소 상태를 확인해 주세요.');
    return false;
  }
}

window.addEventListener('storage', event => {
  if (event.key !== KEY && event.key !== null) return;
  if (dialog.open) dialog.close('cancel');
  location.reload();
});

const pad = value => String(value).padStart(2,'0');
function stamp(ms) {
  const date = new Date(ms);
  const day = [date.getFullYear(), pad(date.getMonth()+1), pad(date.getDate())].join('-');
  return day+'T'+[date.getHours(),date.getMinutes(),date.getSeconds()].map(pad).join(':');
}
const moment = (ms = Date.now()) => {
  ms = Math.floor(ms/1000)*1000;
  return {ms, local:stamp(ms)};
};
const readable = time => time.local.replace('T',' ');
const dayLabel = local => {
  const [year,month,day] = local.slice(0,10).split('-');
  return year+'년 '+Number(month)+'월 '+Number(day)+'일';
};
const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function phase(record) {
  if (!record) return 'ready';
  if (record.secondEnd || record.finish) return 'done';
  if (record.secondStart) return 'second';
  return record.firstEnd ? 'break' : 'first';
}

function lengths(record, now = Date.now()) {
  const diff = (start,end) => start ? Math.max(0,Math.floor(((end?.ms ?? now)-start.ms)/1000)) : 0;
  const first = diff(record?.firstStart,record?.firstEnd);
  const second = diff(record?.secondStart,record?.secondEnd);
  return {first,second,total:first+second};
}

function duration(seconds) {
  return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(pad).join(':');
}

function btn(action,label,classes='btn') {
  return '<button type="button" class="'+classes+'" data-action="'+action+'">'+label+'</button>';
}

function timeline(record) {
  const rows = Object.entries(LABELS).filter(([key])=>record[key]).map(([key,label])=>{
    const editButton = view==='home'
      ? '<button type="button" data-action="editHome" data-event="'+key+'" aria-label="'+label+' 수정">수정</button>'
      : '';
    return '<div class="event record '+(editButton?'event-editable':'')+'"><b>'+label+'</b><time datetime="'
      +record[key].local+'">'+readable(record[key])+'</time>'+editButton+'</div>'
      +(view==='home' && homeEditing===key ? edit(record,key) : '');
  });
  return '<div class="section"><b>경기 시각</b><div class="panel">'+rows.join('')+'</div></div>';
}

function totals(record) {
  const times = lengths(record);
  return '<div class="totals"><span>전반 <b id="first">'+duration(times.first)+'</b></span>'
    +'<span>후반 <b id="second">'+(record.secondStart ? duration(times.second) : '—')+'</b></span>'
    +'<span>실제 경기 합계 <b id="total">'+duration(times.total)+'</b></span></div>';
}

function home() {
  const record = state.active;
  const now = stamp(Date.now());
  const status = phase(record);
  const running = status==='first' || status==='second';
  const statusText = {ready:'기록 대기', first:'전반전 기록중', break:'전반 종료 · 하프타임', second:'후반전 기록중', done:'기록 완료'};
  const controls = {
    ready:btn('firstStart','▶ 전반전 시작','timer-btn ready'),
    first:btn('end','■ 전반전 종료','btn full danger'),
    break:btn('secondStart','▶ 후반전 시작','timer-btn ready')+btn('end','전반만 진행 · 경기 종료','btn full finish-first'),
    second:btn('end','■ 후반전 종료','btn full danger'),
    done:'<div class="complete"><b>복 많이 받고 자랑스런 강승원 대표님!</b><p>수고하셨습니다.</p>'
      +btn('next','새 기록 준비','btn primary full next-ready-pulse')+'</div>'
  };
  return '<div class="match-header"><label class="match-title" for="home-match">경기 정보</label>'
    +'<div class="match-name-field"><input class="match-camera" id="home-match" type="text" maxlength="120" placeholder="연습경기" value="'+escape(record?.match ?? state.match)+'"></div><label class="match-edit-hint" for="home-match" aria-hidden="true"><span class="match-edit-icon">✎</span>수정 가능</label></div>'
    +'<div class="match-date"><span id="match-date">'+dayLabel(now)+'</span><time id="local-clock" aria-label="현재 시각">'+now.slice(11)+'</time></div>'
    +'<div class="scorebox match-clock"><div class="muted">현재 경기 시간</div><div id="clock" class="clock">'+duration(lengths(record).total)+'</div>'
    +'<div class="pill '+(running?'recording-pill':'')+'">'+(running?'<span class="recording-dot" aria-hidden="true"></span>':'')+'<span>'+statusText[status]+'</span></div></div>'
    +'<div class="section">'+controls[status]+'</div>'+(record ? totals(record)+timeline(record) : '')
    +btn('history','▱ 저장된 경기 기록 보기','btn full');
}

function settings() {
  return '<b>설정</b><form id="settings"><div class="panel">'
    +'<label for="player">사용자 이름</label><input id="player" name="player" maxlength="40" value="'+escape(state.name)+'">'
    +'</div><button class="btn full primary">설정 완료</button></form>';
}

function history() {
  const rows = [...state.records].reverse().map(record=>
    '<button type="button" class="saveditem" data-action="open" data-id="'+record.id+'"><span class="between"><b>'+escape(record.match)
    +'</b><span>›</span></span><span class="muted">'+(record.name ? escape(record.name)+' · ' : '')+readable(record.firstStart)
    +' · '+duration(lengths(record).total)+'</span></button>');
  return '<div class="detail-nav">'+btn('home','⌂ 홈','btn nav-large')+'</div>'
    +'<button type="button" class="btn full delete-all-btn" data-action="deleteAll" '+(rows.length?'':'disabled')+'>전체 삭제</button>'
    +'<b>저장된 경기 기록</b>'+(rows.join('') || '<div class="empty section">아직 저장된 경기 기록이 없습니다.</div>');
}

function detail(record) {
  return '<div class="detail-nav">'+btn('history','← 목록','btn nav-large')+btn('home','⌂ 홈','btn nav-large')+'</div>'
    +'<div class="scorebox"><b>'+escape(record.match)+'</b><div class="muted record-meta">'+(record.name ? escape(record.name)+' · ' : '')+dayLabel(record.firstStart.local)+'</div></div>'
    +totals(record)+timeline(record)+'<div class="rowbtn">'+btn('edit','✎ 수정')+btn('xlsx','↓ 경기 기록 저장')+'</div>'
    +btn('delete','이 경기 기록 삭제','btn full danger');
}

function edit(record, eventKey=null) {
  const fields = Object.entries(LABELS).filter(([key])=>record[key] && (!eventKey || key===eventKey)).map(([key,label])=>{
    const [date,time] = record[key].local.split('T');
    const parts = time.split(':');
    const inputs = ['시','분','초'].map((unit,index)=>
      '<label><input required inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" aria-label="'+unit
      +'" name="'+key+'-'+index+'" value="'+parts[index]+'"><span>'+unit+'</span></label>').join('');
    return '<fieldset class="time-fields"><legend>'+label+' 수정</legend><label for="'+key+'">날짜</label>'
      +'<input required type="date" id="'+key+'" name="'+key+'" value="'+date+'">'
      +'<div class="time-parts" role="group" aria-label="시간">'+inputs+'</div></fieldset>';
  }).join('');
  if (eventKey) {
    return '<form id="edit" class="panel event-editor">'+fields+'<p id="edit-error" role="alert" class="form-error"></p>'
      +'<div class="rowbtn">'+btn('cancelHomeEdit','취소')+'<button class="btn primary">수정 저장</button></div></form>';
  }
  return '<section id="edit-panel"><b>경기 기록 수정</b><form id="edit"><div class="panel">'
    +'<label for="edit-match">경기명</label><input id="edit-match" name="match" maxlength="120" value="'+escape(record.match)+'">'
    +fields+'</div><p id="edit-error" role="alert" class="form-error"></p><div class="rowbtn">'
    +btn('detail','취소')+'<button class="btn primary">수정 저장</button></div></form></section>';
}

function render() {
  const record = state.records.find(item=>item.id===selected);
  const title = state.name ? state.name+' '+TITLE : TITLE;
  document.title = title;
  const content = {home,settings,history,detail:()=>record ? detail(record) : history(),edit:()=>record ? edit(record) : history()};
  app.innerHTML = '<div class="app"><header class="top"><h1 class="title">'+escape(title)+'</h1><div class="top-actions">'
    +btn('settings','⚙ 설정','nav-mini')+btn('history','≡ 목록','nav-mini')+btn('home','⌂ 홈','nav-mini')
    +'</div></header>'+(storageError?'<p class="form-error" role="alert">로컬 저장소를 읽을 수 없습니다. 저장소 상태를 확인해 주세요.</p>':'')
    +content[view]()+'</div>';
}

function ask(title, message, label, action, ending=false) {
  dialog.querySelector('#question').textContent = title;
  dialog.querySelector('#explanation').textContent = message;
  const confirm = dialog.querySelector('#confirm-button');
  confirm.textContent = label;
  confirm.className = ending ? 'btn ending' : 'btn danger';
  confirm.dataset.action = ending ? 'end-confirm' : '';
  confirmAction = action;
  dialog.returnValue = 'cancel';
  dialog.showModal();
}
dialog.addEventListener('close', () => {
  const action = confirmAction;
  confirmAction = null;
  if (dialog.returnValue==='confirm') action?.();
});

function start(key) {
  const current = state.active;
  const time = moment();
  if (current && time.ms<current.firstEnd.ms) {
    alert('기기 시각이 전반 종료 시각보다 이릅니다. 기기 날짜와 시간을 확인해 주세요.');
    return;
  }
  const record = current ? {...current,[key]:time} : {id:crypto.randomUUID(),name:state.name,match:state.match,firstStart:time};
  if (save({...state,active:record})) render();
}

function end() {
  const current = state.active;
  const status = phase(current);
  const key = {first:'firstEnd',break:'finish',second:'secondEnd'}[status];
  const previous = {first:'firstStart',break:'firstEnd',second:'secondStart'}[status];
  const time = moment();
  if (time.ms<current[previous].ms) {
    alert('기기 시각이 직전 기록보다 이릅니다. 기기 날짜와 시간을 확인해 주세요.');
    return;
  }
  const question = key==='finish' ? '후반전 없이 이 경기 기록을 마칠까요?' : LABELS[key]+' 시각을 확정하시겠습니까?';
  ask(question, readable(time), '종료 확정', () => {
    const record = {...current,[key]:time};
    const records = phase(record)==='done' ? [...state.records,record] : state.records;
    if (save({...state,active:record,records})) render();
  },true);
}

function remove(id) {
  const records = id ? state.records.filter(record=>record.id!==id) : [];
  const active = phase(state.active)==='done' && !records.some(record=>record.id===state.active.id) ? null : state.active;
  if (save({...state,active,records})) navigate('history');
}

function exportRows(record) {
  const times = lengths(record);
  const headers = ['사용자','경기명',...Object.values(LABELS),'전반 시간','후반 시간','실제 경기 합계'];
  const fields = [record.name,record.match,...Object.keys(LABELS).map(key=>record[key]?readable(record[key]):''),
    duration(times.first),record.secondStart?duration(times.second):'',duration(times.total)];
  return [headers,fields];
}

function downloadFile(record, extension, blob) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = record.firstStart.local.replaceAll(':','-')+'_경기기록.'+extension;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function navigate(target) {
  homeEditing = null;
  view = target;
  render();
}

function closeHomeEditor() {
  const key = homeEditing;
  navigate('home');
  document.querySelector('[data-event="'+key+'"]').focus();
}

app.addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  const record = state.records.find(item=>item.id===selected);
  switch (action) {
    case 'home': case 'settings': case 'history': case 'detail': case 'edit': navigate(action); break;
    case 'firstStart': case 'secondStart': start(action); break;
    case 'end': end(); break;
    case 'next': if (save({...state,active:null})) navigate('home'); break;
    case 'open': selected = button.dataset.id; navigate('detail'); break;
    case 'editHome':
      if (homeEditing===button.dataset.event) {
        closeHomeEditor();
        break;
      }
      homeEditing = button.dataset.event;
      render();
      document.getElementById(homeEditing).focus();
      break;
    case 'cancelHomeEdit':
      closeHomeEditor();
      break;
    case 'xlsx': downloadFile(record,'xlsx',matchWorkbook(record)); break;
    case 'delete': ask('이 경기 기록을 삭제하시겠습니까?', '삭제 후 복구할 수 없습니다.', '삭제', ()=>remove(record.id)); break;
    case 'deleteAll': ask('저장된 기록 '+state.records.length+'개를 모두 삭제하시겠습니까?', '삭제 후 복구할 수 없습니다.', '전체 삭제', ()=>remove(null)); break;
  }
});

function updateRecord(form) {
  const inline = view==='home' && homeEditing;
  const original = inline ? state.active : state.records.find(item=>item.id===selected);
  const record = {...original,match:inline ? original.match : form.get('match').trim() || DEFAULT_MATCH};
  let previous = -Infinity;
  for (const key of Object.keys(LABELS)) {
    if (!record[key]) continue;
    const date = form.get(key);
    const local = date==null ? record[key].local : date+'T'+[0,1,2].map(index=>pad(form.get(key+'-'+index))).join(':');
    const ms = local===record[key].local ? record[key].ms : new Date(local).getTime();
    if (!Number.isFinite(ms) || (local!==record[key].local && stamp(ms)!==local) || ms<previous) {
      document.querySelector('#edit-error').textContent = LABELS[key]+'의 날짜·시분초와 시간 순서를 확인해 주세요.';
      return;
    }
    record[key] = {ms,local};
    previous = ms;
  }
  const active = state.active?.id===record.id ? record : state.active;
  if (save({...state,active,records:state.records.map(item=>item.id===record.id?record:item)})) {
    if (inline) closeHomeEditor();
    else navigate('detail');
  }
}

function saveHomeMatch(input) {
  const match = input.value.trim() || DEFAULT_MATCH;
  const current = state.active;
  if (match===(current?.match ?? state.match)) {
    input.value = match;
    return;
  }
  const active = current ? {...current,match} : null;
  const completed = phase(current)==='done';
  const records = completed ? state.records.map(record=>record.id===active.id?active:record) : state.records;
  if (save({...state,match,active,records})) input.value = match;
}

app.addEventListener('focusout', event => {
  if (event.target.id==='home-match') saveHomeMatch(event.target);
});

app.addEventListener('keydown', event => {
  if (event.target.id!=='home-match' || event.key!=='Enter' || event.isComposing || event.keyCode===229) return;
  event.preventDefault();
  event.target.blur();
});

app.addEventListener('submit', event => {
  event.preventDefault();
  const form = new FormData(event.target);
  if (event.target.id==='edit') {
    updateRecord(form);
    return;
  }
  const name = form.get('player').trim() || DEFAULT_NAME;
  const active = state.active && phase(state.active)!=='done' ? {...state.active,name} : state.active;
  if (save({...state,active,name})) navigate('home');
});

function refreshClock() {
  if (view!=='home') return;
  const now = Date.now();
  const local = stamp(now);
  const times = lengths(state.active,now);
  document.querySelector('#clock').textContent = duration(times.total);
  document.querySelector('#match-date').textContent = dayLabel(local);
  document.querySelector('#local-clock').textContent = local.slice(11);
  if (!state.active) return;
  document.querySelector('#first').textContent = duration(times.first);
  document.querySelector('#total').textContent = duration(times.total);
  if (state.active.secondStart) document.querySelector('#second').textContent = duration(times.second);
}

render();
setInterval(refreshClock,250);
document.addEventListener('visibilitychange',refreshClock);

  </script>

    if ('serviceWorker' in navigator && /^(https?):$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(error => console.error(error));
    }
  </script>
